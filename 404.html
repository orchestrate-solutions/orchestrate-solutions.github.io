<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found — Orchestrate Solutions</title>
  <link rel="stylesheet" href="css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    .error-page {
      min-height: 100vh; min-height: 100dvh;
      display: flex; align-items: center; justify-content: center;
      text-align: center; padding: 2rem;
    }
    .error-code {
      font-size: clamp(5rem, 15vw, 9rem); font-weight: 700;
      color: var(--accent); line-height: 1; margin-bottom: 0.5rem;
      letter-spacing: -0.04em;
    }
    .error-msg { color: var(--text-soft); margin-bottom: 2rem; }
  </style>
</head>
<body>
  <div class="error-page">
    <div>
      <div class="error-code">404</div>
      <h1>Page not found</h1>
      <p class="error-msg">The page you're looking for doesn't exist or has moved.</p>
      <a href="/" class="btn btn--primary btn--lg">Back to Home</a>
    </div>
  </div>
</body>
</html>
